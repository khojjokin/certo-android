name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release bundle
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon bundleRelease -PversionCode=$((100 + ${{ github.run_number }})) 2>&1 | tee build.log
      - name: Publish result to the builds branch
        run: |
          mkdir -p out
          cp build.log out/build.log
          cp app/build/outputs/bundle/release/app-release.aab out/certo-unsigned.aab 2>/dev/null || true
          echo "${{ steps.build.outcome }} run=${{ github.run_number }} sha=${{ github.sha }} versionCode=$((100 + ${{ github.run_number }}))" > out/STATUS
          cd out
          git init -q -b builds
          git config user.name "certo-ci"
          git config user.email "ci@qortyn.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }} (${{ steps.build.outcome }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
